<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Forgot Password | EventPark
    </title>


    <link rel="stylesheet"
          href="../../css/style.css">

    <link rel="stylesheet"
          href="../../css/auth.css">

    <link rel="stylesheet"
          href="../../css/responsive.css">

</head>


<body>


    <!-- Navbar -->
    <div id="navbarContainer"></div>



    <main class="auth-page password-recovery-page">

        <div class="password-recovery-container">


            <section class="password-recovery-card">


                <div class="password-recovery-icon">
                    🔐
                </div>


                <span class="auth-label">
                    PASSWORD RECOVERY
                </span>


                <h1>
                    Forgot your password?
                </h1>


                <p class="password-recovery-description">
                    Enter your email address and we'll send
                    you a password reset link if an account
                    exists for that email.
                </p>



                <!-- Message -->

                <div id="forgotPasswordMessage"
                     class="alert hidden">
                </div>



                <!-- Form -->

                <form id="forgotPasswordForm"
                      novalidate>


                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input type="email"
                               id="email"
                               class="form-control"
                               placeholder="example@email.com"
                               autocomplete="email">

                        <small class="field-error"
                               id="emailError">
                        </small>

                    </div>



                    <button type="submit"
                            class="btn btn-primary btn-block"
                            id="forgotPasswordButton">
                        Send Reset Link
                    </button>

                </form>



                <div class="password-recovery-footer">

                    <a href="login.html"
                       class="back-login-link">
                        ← Back to Login
                    </a>

                </div>


            </section>

        </div>

    </main>



    <!-- Footer -->
    <div id="footerContainer"></div>


    <!-- Confirmation Modal -->
    <div id="confirmationModalContainer"></div>



    <!-- JavaScript -->

    <script src="../../js/config.js"></script>

    <script src="../../js/api.js"></script>

    <script src="../../js/common.js"></script>

    <script src="../../js/auth/forgot-password.js"></script>


</body>

</html>
